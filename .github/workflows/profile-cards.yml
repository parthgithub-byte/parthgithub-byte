name: Update profile cards

on:
  schedule:
    - cron: "17 */6 * * *"   
  workflow_dispatch:
  push:
    paths: [".github/workflows/profile-cards.yml"]

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=radical&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch language + activity cards
        run: |
          mkdir -p profile
          fetch() {
            tmp=$(mktemp)
            if curl -sfL --max-time 45 "$1" -o "$tmp" && head -c 500 "$tmp" | grep -qi "<svg"; then
              mv "$tmp" "$2"; echo "updated $2"
            else
              echo "fetch failed for $2 — keeping previous version"
            fi
          }
          fetch "https://github-readme-stats.shion.dev/api/top-langs/?username=parthgithub-byte&layout=donut-vertical&theme=radical&langs_count=8&hide_border=true" profile/languages.svg
          fetch "https://github-readme-activity-graph.vercel.app/graph?username=parthgithub-byte&bg_color=141321&color=fe428e&line=fe428e&point=a9fef7&area=true&hide_border=true" profile/activity.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile cards" || exit 0
          git push
