name: Update profile cards

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:
  push:
    paths: [".github/workflows/profile-cards.yml"]

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=radical&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: profile/snake.svg?palette=github-dark

      - name: Fetch hosted cards
        run: |
          mkdir -p profile
          fetch() {
            tmp=$(mktemp)
            if curl -sfL --max-time 45 "$1" -o "$tmp" && head -c 500 "$tmp" | grep -qi "<svg"; then
              mv "$tmp" "$2"; echo "OK      $2"
            else
              echo "SKIPPED $2 (fetch failed, keeping previous version)"
            fi
          }

          fetch "https://readme-typing-svg.demolab.com?font=Fira+Code&duration=2500&pause=1000&color=00D9FF&center=true&vCenter=true&width=800&lines=Computer+Engineering+Student+%7C+DYPIT+Pune;Full+Stack+Developer+%7C+React+%2B+Flask;AI+%2F+LLM+%7C+LangChain+%2B+RAG;Open+to+SWE+Internship+Opportunities" profile/typing.svg

          fetch "https://github-readme-stats.shion.dev/api/top-langs/?username=parthgithub-byte&layout=donut-vertical&theme=radical&langs_count=8&hide_border=true" profile/languages.svg

          fetch "https://leetcard.jacoblin.cool/Thecodenthusiast?ext=heatmap&theme=nord" profile/leetcode.svg

          fetch "https://github-readme-activity-graph.vercel.app/graph?username=parthgithub-byte&bg_color=141321&color=fe428e&line=fe428e&point=a9fef7&area=true&hide_border=true" profile/activity.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile cards" || exit 0
          git pull --rebase --autostash
          git push
